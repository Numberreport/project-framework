<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" xml:lang="zh-CN" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<title>项目全景</title>
<rect width="720" height="330" fill="#f7f6f3"/>
<text x="28" y="50" font-size="20" fill="#1f1d1a">项目全景</text>
<text x="28" y="80" font-size="13" fill="#6b6560">虚线是成员引用，不是上下级，也不复制实现。</text>
<text x="28" y="102" font-size="13" fill="#6b6560">信息传递只认已登记的连接。没有则标缺项，不推断执行顺序。</text>
<text x="28" y="124" font-size="13" fill="#6b6560">复用是同一模块，不是多份实现。导航分类不是父级。</text>
<g data-ref="_example_combo _example">
<line x1="388" y1="194" x2="332" y2="194" stroke="#6b6560" stroke-dasharray="5 4"/>
<text x="360" y="186" font-size="12" fill="#6b6560" text-anchor="middle">引用</text>
</g>
<g data-module="_example" data-reuse="0">
<rect x="72" y="146" width="260" height="96" rx="8" fill="#ffffff" stroke="#2c2a26"/>
<text x="88" y="178" font-size="16" fill="#1f1d1a">_example</text>
<text x="88" y="200" font-size="12" fill="#6b6560">实验中 · 模块</text>
<text x="88" y="222" font-size="12" fill="#6b6560">从哪来：外部</text>
</g>
<g data-module="_example_combo" data-reuse="0">
<rect x="388" y="146" width="260" height="96" rx="8" fill="#ffffff" stroke="#2c2a26"/>
<text x="404" y="178" font-size="16" fill="#1f1d1a">_example_combo</text>
<text x="404" y="200" font-size="12" fill="#6b6560">实验中 · 组合</text>
<text x="404" y="222" font-size="12" fill="#6b6560">从哪来：外部</text>
</g>
<text x="28" y="278" font-size="13" fill="#8a3b12" data-gap="_example_combo">缺项：_example_combo 无已登记连接，不推断执行顺序。</text>
</svg>
