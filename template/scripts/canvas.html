<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目画布</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11151c;color:#e4eaf2;font:14px 'Microsoft YaHei',sans-serif}header{padding:16px 22px;background:#1c2330;display:flex;gap:12px;align-items:center}h1{font-size:19px;margin:0 12px 0 0}button,select,input,textarea{font:inherit;color:inherit;background:#283345;border:1px solid #4a5a70;border-radius:6px;padding:7px}button{cursor:pointer}button:hover{background:#3a4c65}.primary{background:#215d8e}main{display:flex;height:calc(100vh - 115px)}#viewport{flex:1;overflow:auto;position:relative}#board{width:3200px;height:2200px;position:relative;background-image:radial-gradient(#364255 1px,transparent 1px);background-size:20px 20px}svg{position:absolute;inset:0;width:3200px;height:2200px;pointer-events:none}.wire{pointer-events:stroke;cursor:pointer;stroke:#78b8e8;stroke-width:3;fill:none}.wire:hover{stroke:#ffba70;stroke-width:6}.node{position:absolute;width:245px;background:#202b3a;border:1px solid #566980;border-radius:10px;box-shadow:0 6px 22px #0005}.title{padding:12px;background:#2c3c50;border-radius:10px 10px 0 0;cursor:move;touch-action:none}.title small{display:block;color:#aebcd0;margin-top:4px;overflow-wrap:anywhere}.ports{padding:8px 0;min-height:36px}.port{padding:7px 10px;cursor:crosshair;touch-action:none;display:flex;gap:8px;align-items:center}.port.out{justify-content:flex-end}.dot{width:12px;height:12px;background:#87c7ed;border:2px solid #172432;border-radius:50%;flex-shrink:0}.out .dot{order:2}.port:hover{background:#344c64}.enter{margin:0 10px 10px}aside{width:335px;padding:18px;overflow:auto;background:#19212d;border-left:1px solid #354359}aside h2{font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 'Microsoft YaHei',sans-serif}#status{padding:10px 22px;height:52px;color:#b4c4d6}label{display:block;margin:12px 0}input,textarea{width:100%;margin-top:6px}dialog{background:#202b3a;color:#e4eaf2;border:1px solid #61738a;border-radius:12px;width:650px;max-width:90vw}dialog::backdrop{background:#0009}#preview{max-height:45vh;overflow:auto}#cancelWire{display:none}
</style>
<header><h1>项目画布</h1><select id="groups" aria-label="当前组合"></select><button id="undo">撤销</button><button id="reload">重新加载</button><button id="cancelWire">取消连线</button><button id="save" class="primary">查看变化并保存</button></header>
<main><div id="viewport"><div id="board"><svg id="wires"></svg><div id="nodes"></div></div></div><aside><h2>使用方法</h2><p>从输出圆点拖到输入圆点建立连接。拖动标题移动模块。点击连线可修改或删除。</p><p>按 Esc 取消连线。进入组合可编辑内部连接。</p><p>自动检查连接结构；内容是否匹配，请对照输入输出要求。</p><div id="details"></div><label>循环停止条件<textarea id="stop" rows="3" placeholder="存在反馈回路时必填"></textarea></label></aside></main>
<div id="status" role="status">正在读取项目…</div>
<dialog id="edgeDialog"><h2>连接信息</h2><p id="endpoints"></p><label>传递什么<input id="info"></label><label>适用条件（可选）<input id="when"></label><button id="applyEdge">确定</button> <button id="deleteEdge">删除连线</button> <button id="closeEdge">取消</button></dialog>
<dialog id="saveDialog"><h2>确认本次修改</h2><pre id="preview"></pre><p>保存会检查结构并更新全景，不会执行模块。</p><button id="confirmSave" class="primary">保存</button> <button id="closeSave">返回编辑</button></dialog>
<dialog id="portsDialog"><h2 id="portsTitle">定义接口</h2><p>每行一个接口，填写名称和要求。输入、输出数量由行数决定，可以为零。名称使用字母、数字、下划线或短横线。</p><h3>输入接口</h3><div id="inputRows"></div><button id="addInput">添加输入</button><h3>输出接口</h3><div id="outputRows"></div><button id="addOutput">添加输出</button><p id="portsError" role="alert"></p><button id="applyPorts" class="primary">应用到画布</button> <button id="closePorts">取消</button></dialog>
<script type="module">
const token='__TOKEN__', $=id=>document.getElementById(id);
let project, group, draft, positions, stop, history=[], pending=null, editIndex=-1, dirty=false, interfaces={};
const clone=x=>JSON.parse(JSON.stringify(x));
const status=s=>$('status').textContent=s;
async function api(url, body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'X-Canvas-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
function record(){history.push({draft:clone(draft),positions:clone(positions),stop,interfaces:clone(interfaces)});dirty=true;}
function select(id){group=project.nodes.find(n=>n.id===id);draft=clone(group.document.connections);positions=clone(project.layout[id]||{});stop=group.document.stop||'';interfaces={};history=[];dirty=false;$('groups').value=id;$('stop').value=stop;cancelWire();render();status('点击“定义接口”设置输入、输出数量和要求。拖线修改后保存。');}
function switchGroup(id){if(dirty&&!confirm('当前修改尚未保存，放弃修改并切换？')){$('groups').value=group.id;return;}select(id);}
function install(data,id){project=data;$('groups').replaceChildren();for(const n of data.nodes.filter(n=>n.document)){const o=document.createElement('option');o.value=n.id;o.textContent=n.name+' · '+n.label;$('groups').append(o);}select(id||data.nodes.find(n=>n.document).id);}
function ports(n,side){return (interfaces[n.id]||n)[side==='in'?'inputs':'outputs'].map(p=>p.name);}
function card(id,name,subtitle,ins,outs,index,actual){const el=document.createElement('section');el.className='node';el.dataset.id=id;const p=positions[id]||{x:40+index*285,y:100+(index%2)*150};positions[id]=p;el.style.left=p.x+'px';el.style.top=p.y+'px';const title=document.createElement('div');title.className='title';title.textContent=name;const small=document.createElement('small');small.textContent=subtitle;title.append(small);el.append(title);
 title.onpointerdown=e=>{if(e.button!==0)return;record();const x=e.clientX,y=e.clientY,start={...positions[id]};title.setPointerCapture(e.pointerId);title.onpointermove=m=>{positions[id]={x:Math.min(2900,Math.max(0,start.x+m.clientX-x)),y:Math.min(1900,Math.max(0,start.y+m.clientY-y))};el.style.left=positions[id].x+'px';el.style.top=positions[id].y+'px';draw();};title.onpointerup=()=>{title.onpointermove=null;};};
 for(const [side,list] of [['in',ins],['out',outs]]){const box=document.createElement('div');box.className='ports';for(const port of list){const row=document.createElement('div');row.className='port '+side;row.dataset.port=port;row.dataset.side=side;const dot=document.createElement('span');dot.className='dot';const label=document.createElement('span');label.textContent=port;row.append(dot,label);row.onpointerdown=e=>{e.stopPropagation();if(side==='out'){pending={module:actual,port};$('cancelWire').style.display='inline-block';status('拖到目标输入圆点，或点击目标输入。');}};row.onpointerup=e=>{e.stopPropagation();if(side==='in'&&pending){openEdge({from:pending,to:{module:actual,port},info:''},-1);cancelWire();}};box.append(row);}el.append(box);}
 el.onclick=()=>{const n=project.nodes.find(n=>n.id===actual)||group;const d=$('details');d.replaceChildren();const h=document.createElement('h2');h.textContent=n.name;const pre=document.createElement('pre');pre.textContent=n.input+'\n'+n.output;d.append(h,pre);};
 const n=actual==='$self'?group:project.nodes.find(n=>n.id===actual);const edit=document.createElement('button');edit.className='enter';edit.textContent='定义接口';edit.setAttribute('aria-label',n.name+'：定义接口'+(id==='$input'?'（组合输入）':id==='$output'?'（组合输出）':''));edit.onclick=e=>{e.stopPropagation();openPorts(n);};el.append(edit);if(actual!=='$self'&&n?.document){const b=document.createElement('button');b.className='enter';b.textContent='进入组合';b.onclick=e=>{e.stopPropagation();switchGroup(actual);};el.append(b);}$('nodes').append(el);}
function shownPorts(n,side){const names=new Set(ports(n,side));for(const e of draft){const end=n===group?(side==='in'?e.from:e.to):(side==='in'?e.to:e.from);if(end.module===(n===group?'$self':n.id))names.add(end.port);}return [...names];}
function render(){$('nodes').replaceChildren();const members=group.children.map(id=>project.nodes.find(n=>n.id===id));card('$input','组合输入',group.name+' · '+ports(group,'in').length+' 个输入',[],shownPorts(group,'in'),0,'$self');members.forEach((n,i)=>card(n.id,n.name,n.label+' · '+ports(n,'in').length+' 入 / '+ports(n,'out').length+' 出',shownPorts(n,'in'),shownPorts(n,'out'),i+1,n.id));card('$output','组合输出',group.name+' · '+ports(group,'out').length+' 个输出',shownPorts(group,'out'),[],members.length+1,'$self');for(const el of $('nodes').children){const n=el.dataset.id.startsWith('$')?group:members.find(n=>n.id===el.dataset.id);for(const row of el.querySelectorAll('.port')){const side=n===group?(el.dataset.id==='$input'?'in':'out'):row.dataset.side;if(!ports(n,side).includes(row.dataset.port)){row.style.color='#ffba70';row.title='接口已移除，请修改或删除仍引用它的连线';row.querySelector('span:last-child').textContent=row.dataset.port+'（未定义）';}}}requestAnimationFrame(draw);}
function point(end,side){const id=end.module==='$self'?(side==='out'?'$input':'$output'):end.module;const el=[...$('nodes').children].find(n=>n.dataset.id===id);const port=el&&[...el.querySelectorAll('.port')].find(p=>p.dataset.side===side&&p.dataset.port===end.port);if(!port)return null;const r=port.querySelector('.dot').getBoundingClientRect(),b=$('board').getBoundingClientRect();return{x:r.x+r.width/2-b.x,y:r.y+r.height/2-b.y};}
function draw(){$('wires').replaceChildren();draft.forEach((e,i)=>{const a=point(e.from,'out'),b=point(e.to,'in');if(!a||!b)return;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${a.x} ${a.y} C ${a.x+100} ${a.y}, ${b.x-100} ${b.y}, ${b.x} ${b.y}`);path.classList.add('wire');const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=e.info+(e.when?' · '+e.when:'');path.append(title);path.onclick=()=>openEdge(e,i);$('wires').append(path);});}
let editing;
function openEdge(e,i){editing=clone(e);editIndex=i;$('endpoints').textContent=e.from.module+'.'+e.from.port+' → '+e.to.module+'.'+e.to.port;$('info').value=e.info;$('when').value=e.when||'';$('deleteEdge').hidden=i<0;$('edgeDialog').showModal();}
function cancelWire(){pending=null;$('cancelWire').style.display='none';}
$('cancelWire').onclick=cancelWire;document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelWire();});
$('applyEdge').onclick=()=>{if(!$('info').value.trim()){status('请说明传递什么信息。');return;}editing.info=$('info').value.trim();if($('when').value.trim())editing.when=$('when').value.trim();else delete editing.when;record();if(editIndex<0)draft.push(editing);else draft[editIndex]=editing;$('edgeDialog').close();render();status('连接已修改，尚未保存。');};
$('deleteEdge').onclick=()=>{record();draft.splice(editIndex,1);$('edgeDialog').close();render();};$('closeEdge').onclick=()=>$('edgeDialog').close();
$('undo').onclick=()=>{const h=history.pop();if(!h)return;({draft,positions,stop,interfaces}=h);$('stop').value=stop;dirty=history.length>0;render();status('已撤销上一步。');};
$('stop').onchange=()=>{record();stop=$('stop').value;};$('groups').onchange=()=>switchGroup($('groups').value);
$('reload').onclick=async()=>{if(dirty&&!confirm('放弃未保存的修改并重新加载？'))return;try{install(await api('/api/project'),group.id);}catch(e){status(e.message);}};
$('save').onclick=()=>{const before=group.document.connections;const line=e=>e.from.module+'.'+e.from.port+' → '+e.to.module+'.'+e.to.port+'：'+e.info+(e.when?'；条件：'+e.when:'');const removed=before.filter(e=>!draft.some(d=>JSON.stringify(e)===JSON.stringify(d)));const added=draft.filter(e=>!before.some(d=>JSON.stringify(e)===JSON.stringify(d)));const portChanges=Object.entries(interfaces).map(([id,p])=>{const n=project.nodes.find(n=>n.id===id);return n.name+'\n原接口：'+JSON.stringify({inputs:n.inputs,outputs:n.outputs},null,2)+'\n新接口：'+JSON.stringify(p,null,2);});$('preview').textContent=['移除连接：',...removed.map(line),'\n新增连接：',...added.map(line),'\n接口修改：',...portChanges,'\n停止条件：'+(stop||'无'),'\n同时保存当前组合的节点位置。'].join('\n');$('saveDialog').showModal();};
$('closeSave').onclick=()=>$('saveDialog').close();$('confirmSave').onclick=async()=>{$('confirmSave').disabled=true;try{const changes=Object.entries(interfaces).map(([id,p])=>({id,...p,revision:project.nodes.find(n=>n.id===id).interfaceRevision}));const data=await api('/api/save',{id:group.id,revision:group.revision,layoutRevision:project.layoutRevision,connections:draft,positions,stop,interfaces:changes});install(data,group.id);$('saveDialog').close();status('已保存接口、连接和节点位置，并更新静态全景。');}catch(e){status('保存失败：'+e.message);$('saveDialog').close();}finally{$('confirmSave').disabled=false;}};
let editingModule;
function addPortRow(side,port={name:'',description:''}){const box=$(side==='inputs'?'inputRows':'outputRows'),row=document.createElement('div');row.style='border-bottom:1px solid #526174;padding:8px 0';const name=document.createElement('input');name.value=port.name;name.placeholder='接口名称，如 image';name.setAttribute('aria-label',side==='inputs'?'输入接口名称':'输出接口名称');const description=document.createElement('input');description.value=port.description;description.placeholder='接收或交付什么，有什么要求';description.setAttribute('aria-label',side==='inputs'?'输入接口要求':'输出接口要求');const del=document.createElement('button');del.textContent='移除此接口';del.onclick=()=>row.remove();row.append(name,description,del);box.append(row);}
function openPorts(n){editingModule=n;$('portsTitle').textContent=n.name+'：定义接口';$('portsError').textContent='';$('inputRows').replaceChildren();$('outputRows').replaceChildren();const p=interfaces[n.id]||n;p.inputs.forEach(port=>addPortRow('inputs',port));p.outputs.forEach(port=>addPortRow('outputs',port));$('portsDialog').showModal();}
$('addInput').onclick=()=>addPortRow('inputs');$('addOutput').onclick=()=>addPortRow('outputs');$('closePorts').onclick=()=>$('portsDialog').close();
$('applyPorts').onclick=()=>{const p={};for(const [side,box] of [['inputs','inputRows'],['outputs','outputRows']]){p[side]=[...$(box).children].map(row=>({name:row.children[0].value.trim(),description:row.children[1].value.trim()}));const names=new Set();for(const port of p[side]){if(!/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(port.name)||!port.description||names.has(port.name)){$('portsError').textContent='请填写有效名称和要求；同一方向的名称不能重复。';return;}names.add(port.name);}}record();interfaces[editingModule.id]=p;$('portsDialog').close();render();status('接口已应用到画布，保存后写入模块文件。仍引用已移除接口的连线须先修改或删除。');};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
try{install(await api('/api/project'));}catch(e){status(e.message);}
</script></html>
